<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E8">
<title>ALL IN Retail Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F0E8; --paper:#FBF9F5; --ink:#2A2724; --mute:#8B847A; --line:#E2DCD1;
  --accent:#6E5B43; --accent-soft:#EDE5D8; --old:#E7DDCC; --warn:#A8452E; --warn-soft:#F6E4DE; --ok:#4F6B4A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 120px}
header{padding:12px 0 20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{font-family:"Noto Serif TC",serif;font-size:13px;letter-spacing:.32em;color:var(--mute)}
h1{font-family:"Noto Serif TC",serif;font-weight:500;font-size:24px;margin:6px 0 2px;letter-spacing:.04em}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.label{font-size:12px;color:var(--mute);letter-spacing:.08em;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;height:44px;font:inherit;font-weight:500;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mode{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px 12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.mode b{display:block;font-family:"Noto Serif TC",serif;font-weight:500;font-size:17px}
.mode span{font-size:12px;color:var(--mute)}
.mode.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.mode.on span{color:#CFC7BA}
.mode:disabled{opacity:.45;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
input[type=text],input[type=date],input[type=password]{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px;font:inherit;color:var(--ink)}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.series h2{font-family:"Noto Serif TC",serif;font-weight:500;font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.series h2 small{font-family:"Noto Sans TC";font-size:12px;color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 76px 64px 64px;gap:6px;align-items:center}
.gh{font-size:11px;color:var(--mute);text-align:center}
.name{font-size:14px;font-weight:500;line-height:1.25;grid-column:span 2}
.name .meta{display:block;font-size:11px;color:var(--mute);font-weight:400}
.meta.low{color:var(--warn)!important}
.num,.expin{width:100%;height:44px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:center;font:inherit;font-size:16px;color:var(--ink);padding:0;-moz-appearance:textfield}
.expin{font-size:14px}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num::placeholder,.expin::placeholder{color:#C9C1B4}
/* 全食飲 口味 */
.flavor{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.flavor:first-of-type{margin-top:0}
.flavor b{font-size:15px}
.flavor .meta{font-size:11px;color:var(--mute)}
.tierrow{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 76px 64px 64px;gap:6px;align-items:center;padding:8px 8px 8px 10px;border-radius:8px}
.tierrow.old{background:var(--old);border-left:4px solid var(--accent)}
.tierrow.new{background:#fff;border:1px dashed #CFC5B4;border-left:4px solid #CFC5B4}
.tag{display:flex;flex-direction:column;line-height:1.2}
.tag b{font-size:14px}
.tierrow.old .tag b{color:var(--accent)}
.tag i{font-style:normal;font-size:11px;color:var(--mute)}
.tierrow.old .num,.tierrow.old .expin{border-color:#D6C9B3}
.btn{height:44px;border-radius:8px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:500;padding:0 16px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line);color:var(--mute)}
.btn:disabled{opacity:.4}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,240,232,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .status{flex:1;font-size:12px;color:var(--mute)}
.notice{border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:16px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.ok{background:#E5EBDF;color:var(--ok)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.review{position:fixed;inset:0;background:rgba(42,39,36,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.review.show{display:flex}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-family:"Noto Serif TC",serif;font-weight:500;margin:0 0 12px}
.sum{width:100%;border-collapse:collapse;font-size:13px}
.sum td,.sum th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.sum td:first-child,.sum th:first-child{text-align:left}
.sum th{font-weight:500;color:var(--mute);font-size:12px}
.sum tr.old td{background:var(--old)}
.sum tr.low td{color:var(--warn)}
.hidden{display:none!important}
.lock{max-width:320px;margin:15vh auto 0;text-align:center}
.lock input{text-align:center;letter-spacing:.4em;margin:16px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">ALL IN · RETAIL</div>
    <h1>櫃位庫存</h1>
    <div class="sub">早班盤點前一日晚班庫存，同步至營運端補貨表。</div>
  </header>

  <div id="lock" class="lock hidden">
    <div class="label">櫃位 PIN</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <button class="btn primary" style="width:100%" id="pinGo">進入</button>
    <div class="hint" id="pinMsg"></div>
  </div>

  <div id="main" class="hidden">
    <div id="msg"></div>
    <section class="card">
      <div class="label">櫃位</div>
      <div class="seg" id="stores"></div>
      <div class="row2 hidden" id="who">
        <div>
          <div class="label" id="dateLabel">日期</div>
          <input type="date" id="date">
        </div>
        <div>
          <div class="label" id="staffLabel">姓名</div>
          <input type="text" id="staff" placeholder="姓名" autocomplete="name">
        </div>
      </div>
      <div class="hint" id="dateHint"></div>
    </section>
    <div id="form"></div>
  </div>
</div>

<div class="bar hidden" id="bar"><div class="in">
  <div class="status" id="status">請選擇櫃位與項目</div>
  <button class="btn primary" id="reviewBtn" disabled>檢查並送出</button>
</div></div>

<div class="review" id="review"><div class="sheet">
  <h3 id="reviewTitle">送出前確認</h3>
  <div id="reviewBody"></div>
  <div style="display:flex;gap:10px;margin-top:16px">
    <button class="btn ghost" id="back" style="flex:1">返回修改</button>
    <button class="btn primary" id="submit" style="flex:2">確認送出</button>
  </div>
</div></div>

<script src="config.js"></script>
<script>
(function(){
const API=(window.PORTAL_CONFIG||{}).API_URL||'';
const STORES=['信義','天母','竹北','中港','大安'];
// 已下架品項：不顯示於盤點（試算表列保留，送出時以空白計）
const HIDDEN=['小全頭|黃豆'];
const MODE={
  count:{name:'庫存盤點',staff:'盤點人',date:'盤點日期',a:'shelf',b:'wh',ha:'櫃位',hb:'倉庫'}
};
const $=s=>document.querySelector(s);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let S={store:null,mode:null,data:null,lines:[]};
const key=l=>[l.series,l.product,l.tier||''].join('|');
const blank=v=>v===''||v===null||v===undefined;

/* API */
async function apiGet(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const j=await (await fetch(u)).json();if(!j.ok)throw new Error(j.error||'讀取失敗');return j}
async function apiPost(b){const j=await (await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)})).json();if(!j.ok)throw new Error(j.error||'送出失敗');return j}

/* 日期 */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const shift=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const md=s=>{if(!s)return'';const p=s.split('-');return +p[1]+'/'+(+p[2])};
function hint(){
  const v=$('#date').value;if(!v||!S.mode)return;
  if(S.mode==='count'){const d=new Date(v+'T00:00:00');d.setDate(d.getDate()+1);$('#dateHint').textContent='記錄 '+md(v)+' 晚班結束時的庫存（'+md(ymd(d))+' 早班盤點）';}
}
function msg(t,type){$('#msg').innerHTML=t?'<div class="notice '+(type||'info')+'">'+t+'</div>':''}

/* PIN */
function needPin(){$('#lock').classList.remove('hidden');$('#main').classList.add('hidden');$('#bar').classList.add('hidden');setTimeout(()=>$('#pin').focus(),50)}
$('#pinGo').onclick=async()=>{const p=$('#pin').value.trim();$('#pinMsg').textContent='驗證中…';try{await apiGet({pin:p});ls.set('portal_pin',p);$('#lock').classList.add('hidden');boot()}catch(e){$('#pinMsg').textContent=e.message}};
$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#pinGo').click()});

/* 啟動 */
function boot(){
  $('#main').classList.remove('hidden');$('#bar').classList.remove('hidden');
  $('#stores').innerHTML=STORES.map(s=>'<button data-s="'+s+'">'+s+'</button>').join('');
  $('#stores').onclick=e=>{const b=e.target.closest('button');if(b)pickStore(b.dataset.s)};
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>pickMode(b.dataset.m));
  $('#date').onchange=()=>{hint();if(S.mode)build()};
  $('#staff').value=ls.get('portal_staff')||'';
  $('#staff').oninput=()=>ls.set('portal_staff',$('#staff').value);
  const last=ls.get('portal_store');if(last&&STORES.includes(last))pickStore(last);
}

async function pickStore(s){
  S.store=s;S.data=null;ls.set('portal_store',s);
  [...$('#stores').children].forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  document.querySelectorAll('.mode').forEach(b=>b.disabled=true);
  $('#form').innerHTML='<div class="card" style="color:var(--mute)">讀取 '+s+' 資料中…</div>';msg('');
  try{
    S.data=await apiGet({action:'load',store:s,pin:ls.get('portal_pin')||''});
    S.data.lines=S.data.lines.filter(l=>!HIDDEN.includes(l.series+'|'+l.product));
    document.querySelectorAll('.mode').forEach(b=>b.disabled=false);
    pickMode('count',S.mode==='count');
  }catch(e){
    if(/PIN/.test(e.message)){ls.del('portal_pin');needPin();return}
    $('#form').innerHTML='';msg('讀取失敗：'+e.message,'warn');
  }
}

function pickMode(m,keepDate){
  S.mode=m;
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#who').classList.remove('hidden');
  $('#dateLabel').textContent=MODE[m].date;$('#staffLabel').textContent=MODE[m].staff;
  if(!keepDate||!$('#date').value)$('#date').value=m==='count'?shift(-1):shift(0);
  hint();build();
}

/* 組資料 */
function build(){
  if(!S.data||!S.mode)return;
  const M=MODE[S.mode],d=S.data,date=$('#date').value;
  const meta=d.count;
  const same=meta.date===date;
  S.lines=d.lines.map(l=>({series:l.series,product:l.product,tier:l.tier,min:l.min,expiry:l.expiry||'',
    prevShelf:l.shelf,prevWh:l.wh,
    [M.a]:same?l[M.a]:'',[M.b]:same?l[M.b]:''}));
  if(same)msg(S.store+' '+md(date)+' '+M.name+'已於 '+meta.at+' 由 '+(meta.staff||'—')+' 送出。修改後再次送出將覆蓋。','info');
  else if(S.mode==='count'&&d.count.date)msg('灰色數字為上次盤點（'+md(d.count.date)+'）的庫存，供對照。','info');
  else msg('');
  const dr=loadDraft();if(dr){S.lines.forEach(l=>{const x=dr[key(l)];if(x)Object.assign(l,x)});msg('已還原未送出的草稿。','info')}
  render();
}

/* 草稿 */
const dKey=()=>'portal_draft2|'+S.store+'|'+S.mode+'|'+$('#date').value;
function saveDraft(){const M=MODE[S.mode],o={};S.lines.forEach(l=>o[key(l)]={expiry:l.expiry,[M.a]:l[M.a],[M.b]:l[M.b]});ls.set(dKey(),JSON.stringify(o))}
function loadDraft(){try{return JSON.parse(ls.get(dKey())||'null')}catch(e){return null}}

/* 畫面 */
const v=x=>blank(x)?'':x;
function num(l,i,f,ph){return '<input class="num" inputmode="numeric" pattern="[0-9]*" data-i="'+i+'" data-f="'+f+'" value="'+v(l[f])+'" placeholder="'+v(ph)+'">'}
function total(arr){let t=0,any=false;arr.forEach(l=>[l.shelf,l.wh].forEach(x=>{if(!blank(x)){t+=+x;any=true}}));return any?t:null}
function metaText(arr,min){
  const t=total(arr);return t===null?(blank(min)?'':'水位 '+min):'合計 '+t+(blank(min)?'':' ／ 水位 '+min);
}
const isLow=(arr,min)=>S.mode==='count'&&total(arr)!==null&&!blank(min)&&total(arr)<+min;

function render(){
  const M=MODE[S.mode];
  const groups={};S.lines.forEach((l,i)=>(groups[l.series]=groups[l.series]||[]).push([l,i]));
  let h='';
  Object.entries(groups).forEach(([series,arr])=>{
    const isBev=series==='全食飲';
    h+='<section class="card series"><h2>'+series+(isBev?'<small>舊效期在上・新效期在下</small>':'')+'</h2><div class="grid">';
    h+='<div class="gh" style="text-align:left">'+(isBev?'':'品項')+'</div><div class="gh">'+(isBev?'效期':'')+'</div><div class="gh">'+M.ha+'</div><div class="gh">'+M.hb+'</div>';
    if(isBev){
      const byP={};arr.forEach(x=>(byP[x[0].product]=byP[x[0].product]||[]).push(x));
      Object.entries(byP).forEach(([p,rows])=>{
        const ls_=rows.map(x=>x[0]),min=ls_[0].min;
        h+='<div class="flavor"><b>'+p+'</b><span class="meta'+(isLow(ls_,min)?' low':'')+'" data-p="'+p+'">'+metaText(ls_,min)+'</span></div>';
        rows.forEach(([l,i])=>{
          const old=l.tier==='舊';
          h+='<div class="tierrow '+(old?'old':'new')+'"><div class="tag"><b>'+(old?'舊':'新')+'</b><i>'+(old?'效期較早':'效期較晚')+'</i></div>'+
             '<input class="expin" inputmode="numeric" data-i="'+i+'" data-f="expiry" placeholder="MMDD" value="'+v(l.expiry)+'">'+
             num(l,i,M.a,S.mode==='count'?l.prevShelf:'')+num(l,i,M.b,S.mode==='count'?l.prevWh:'')+'</div>';
        });
      });
    }else{
      arr.forEach(([l,i])=>{
        h+='<div class="name">'+l.product+'<span class="meta'+(isLow([l],l.min)?' low':'')+'" data-m="'+i+'">'+metaText([l],l.min)+'</span></div>'+
           num(l,i,M.a,S.mode==='count'?l.prevShelf:'')+num(l,i,M.b,S.mode==='count'?l.prevWh:'');
      });
    }
    h+='</div></section>';
  });
  $('#form').innerHTML=h;refresh();
}

$('#form').addEventListener('input',e=>{
  const t=e.target;if(!t.dataset.f)return;
  t.value=t.value.replace(/[^0-9]/g,'');
  const l=S.lines[+t.dataset.i],f=t.dataset.f;
  l[f]=t.value===''?'':(f==='expiry'?t.value:+t.value);
  if(l.series==='全食飲'){const arr=S.lines.filter(x=>x.series==='全食飲'&&x.product===l.product),el=document.querySelector('[data-p="'+l.product+'"]');el.textContent=metaText(arr,arr[0].min);el.classList.toggle('low',isLow(arr,arr[0].min))}
  else{const el=document.querySelector('[data-m="'+t.dataset.i+'"]');el.textContent=metaText([l],l.min);el.classList.toggle('low',isLow([l],l.min))}
  saveDraft();refresh();
});

/* 狀態列 */
function refresh(){
  if(!S.store||!S.mode||!S.lines.length){$('#status').textContent=S.store?'資料讀取中…':'請選擇櫃位';$('#reviewBtn').disabled=true;return}
  const M=MODE[S.mode];
  if(S.mode==='count'){const b=S.lines.filter(l=>blank(l.shelf)).length;$('#status').textContent=S.store+'・'+M.name+'・'+md($('#date').value)+'　'+(b?'櫃位尚有 '+b+' 項未填':'櫃位已全數填寫')}
  $('#reviewBtn').disabled=false;
}

/* 確認與送出 */
const nm=l=>l.series.slice(0,3)+'・'+l.product+(l.tier?'（'+l.tier+(l.expiry?' '+l.expiry:'')+'）':'');
$('#reviewBtn').onclick=()=>{
  const M=MODE[S.mode],errs=[];
  if(!$('#staff').value.trim())errs.push('請填寫'+M.staff);
  let h='';
  if(S.mode==='count'){
    const noExp=S.lines.filter(l=>l.series==='全食飲'&&(+l.shelf||0)+(+l.wh||0)>0&&!l.expiry);
    if(noExp.length)errs.push('全食飲有庫存但未填效期：'+noExp.map(l=>l.product+'（'+l.tier+'）').join('、'));
    const b=S.lines.filter(l=>blank(l.shelf)).length;
    if(errs.length)h+='<div class="notice warn">'+errs.join('<br>')+'</div>';
    if(b)h+='<div class="notice info">櫃位有 '+b+' 項空白，以空白（0）計算。</div>';
    h+='<div class="sub" style="margin-bottom:8px">'+S.store+'｜'+md($('#date').value)+' 晚班庫存｜'+($('#staff').value||'—')+'</div>';
    h+='<table class="sum"><tr><th>品項</th><th>櫃位</th><th>倉庫</th><th>合計</th></tr>';
    S.lines.forEach(l=>{const t=total([l]);const low=l.series!=='全食飲'&&isLow([l],l.min);h+='<tr class="'+(l.tier==='舊'?'old ':'')+(low?'low':'')+'"><td>'+nm(l)+'</td><td>'+v(l.shelf)+'</td><td>'+v(l.wh)+'</td><td>'+(t===null?'':t)+'</td></tr>'});
    h+='</table>';
  }
  $('#reviewTitle').textContent=M.name+'｜送出前確認';
  $('#reviewBody').innerHTML=h;$('#submit').disabled=errs.length>0;$('#review').classList.add('show');
};
$('#back').onclick=()=>$('#review').classList.remove('show');
$('#submit').onclick=async()=>{
  const M=MODE[S.mode];
  $('#submit').disabled=true;$('#submit').textContent='送出中…';
  try{
    const r=await apiPost({pin:ls.get('portal_pin')||'',mode:S.mode,store:S.store,date:$('#date').value,staff:$('#staff').value.trim(),
      lines:S.lines.map(l=>({series:l.series,product:l.product,tier:l.tier,expiry:l.expiry,[M.a]:l[M.a],[M.b]:l[M.b]}))});
    ls.del(dKey());$('#review').classList.remove('show');
    const meta=S.data.count;Object.assign(meta,{date:$('#date').value,staff:$('#staff').value.trim(),at:r.updated});
    S.lines.forEach((l,i)=>{const d=S.data.lines[i];d[M.a]=l[M.a];d[M.b]=l[M.b];if(l.expiry||S.mode==='count')d.expiry=l.expiry});
    msg('已送出 '+S.store+' '+md($('#date').value)+' '+M.name+'（'+r.updated+'），營運端表格已同步。','ok');
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){$('#reviewBody').insertAdjacentHTML('afterbegin','<div class="notice warn">送出失敗：'+e.message+'</div>')}
  $('#submit').textContent='確認送出';$('#submit').disabled=false;
};

/* start */
